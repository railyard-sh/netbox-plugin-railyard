name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: NetBox-free suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: pytest -q

  netbox:
    name: integration suite (NetBox ${{ matrix.netbox }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The releases the plugin supports (PluginConfig min_version/max_version): keep them in step.
        netbox: ["4.5.10", "4.6.10", "4.7.2"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
          POSTGRES_DB: netbox
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: netbox-community/netbox
          ref: v${{ matrix.netbox }}
          path: .netbox
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NetBox
        run: |
          python -m venv .netbox/.venv
          .netbox/.venv/bin/pip install -q -r .netbox/requirements.txt
      - name: Configure NetBox
        run: |
          cat > .netbox/netbox/netbox/configuration.py <<'CONF'
          ALLOWED_HOSTS = ["*"]
          DATABASES = {"default": {"NAME": "netbox", "USER": "netbox", "PASSWORD": "netbox",
                                   "HOST": "localhost", "PORT": 5432}}
          REDIS = {
              "tasks": {"HOST": "localhost", "PORT": 6379, "DATABASE": 0, "SSL": False},
              "caching": {"HOST": "localhost", "PORT": 6379, "DATABASE": 1, "SSL": False},
          }
          SECRET_KEY = "ci-only-not-a-secret-ci-only-not-a-secret-ci-only-not-a-secret"
          # v2 API tokens (the import tests read this NetBox's REST API with one)
          API_TOKEN_PEPPERS = {1: "ci-only-pepper-ci-only-pepper-ci-only-pepper-ci-only-pepper"}
          DEBUG = False
          PLUGINS = ["netbox_railyard"]
          CONF
      - name: Test
        run: NETBOX_DIR="$PWD/.netbox" ./dev/run-integration-tests.sh

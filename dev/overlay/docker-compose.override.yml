# netbox-docker override: build the NetBox image with the Railyard plugin baked in, and pass the
# Railyard connection through from the host environment. Applied by dev/setup.sh.
services:
  netbox:
    image: netbox-railyard:plugins
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile-Plugins
      args:
        VERSION: ${VERSION:-v4.6-3.4.0}
    ports:
      # Loopback only: this NetBox has a default-ish setup and holds your Railyard token, so don't
      # expose it to the network.
      - "127.0.0.1:8000:8080"
    environment:
      RAILYARD_URL: ${RAILYARD_URL:-https://railyard.sh}
      RAILYARD_TOKEN: ${RAILYARD_TOKEN:-}
      RAILYARD_ORG: ${RAILYARD_ORG:-}
      RAILYARD_ALLOWED_ORGS: ${RAILYARD_ALLOWED_ORGS:-}
      RAILYARD_DEVICETYPE_REF: ${RAILYARD_DEVICETYPE_REF:-}

  netbox-worker:
    image: netbox-railyard:plugins
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile-Plugins
      args:
        VERSION: ${VERSION:-v4.6-3.4.0}
    environment:
      RAILYARD_URL: ${RAILYARD_URL:-https://railyard.sh}
      RAILYARD_TOKEN: ${RAILYARD_TOKEN:-}
      RAILYARD_ORG: ${RAILYARD_ORG:-}
      RAILYARD_ALLOWED_ORGS: ${RAILYARD_ALLOWED_ORGS:-}
      RAILYARD_DEVICETYPE_REF: ${RAILYARD_DEVICETYPE_REF:-}

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-plugin-railyard"
version = "0.2.0"
description = "Sync a Railyard data-centre design into NetBox, and import NetBox sites into Railyard."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Railyard" }]
keywords = ["netbox", "netbox-plugin", "dcim", "diffsync", "railyard", "ssot", "import", "export"]
classifiers = [
  "Framework :: Django",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
]

# The Railyard side (API client, sync-document source, canonical DiffSync models, importer, ownership tag)
# is the shared railyard-sync package, so the plugin and the `railyard-sync` CLI behave identically.
# railyard-sync is not on PyPI yet: it is installed from GitHub, pinned to a commit (move this to the
# release tag, then to a PyPI version range, as soon as they exist). NetBox itself supplies Django and the
# DCIM ORM at runtime, so they are deliberately NOT listed here.
#
# Lower bounds are security floors; upper bounds stop an untested major release arriving silently:
# - requests 2.32.4 fixes CVE-2024-35195 and CVE-2024-47081 (railyard-sync requires the same floor).
# - diffsync 2.x is the API the target adapter is written against (Adapter, DiffSyncFlags).
dependencies = [
  "railyard-sync @ git+https://github.com/railyard-sh/railyard-sync@e5d10b90a36858b3d28133715074e5848ecd866a",
  "diffsync>=2.2,<3",
  "requests>=2.32.4,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/railyard-sh/netbox-plugin-railyard"
Source = "https://github.com/railyard-sh/netbox-plugin-railyard"
Railyard = "https://railyard.sh"

[tool.setuptools.packages.find]
include = ["netbox_railyard*"]

[tool.setuptools.package-data]
netbox_railyard = ["templates/**/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The NetBox-free suite imports only `netbox_railyard.policy` (and railyard-sync), so it runs without a
# NetBox install; tests/integration runs under NetBox's test runner.
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
combine-as-imports = true
